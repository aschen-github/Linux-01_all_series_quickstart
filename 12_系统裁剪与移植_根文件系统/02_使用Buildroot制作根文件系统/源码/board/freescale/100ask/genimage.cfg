image  emmc.img {
  hdimage {              // Generates DOS partition images.

  }

  partition rootfs-1 {
    partition-type = 0xC
    bootable = "yes"
    size = 10M            // 分区大小为10M
  }
  partition rootfs-2 {
    partition-type = 0x83
    bootable = "yes"
    image = "rootfs.ext4" // 这个分区里直接写入映像文件myrootfs.ext4
    size = 1000M            // 分区大小为100M
  }

